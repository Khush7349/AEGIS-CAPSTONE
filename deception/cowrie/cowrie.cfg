[cowrie]
# Sample Cowrie honeypot config
hostname = aegis-honeypot
log_file = /var/log/cowrie/cowrie.log
log_level = INFO

[ssh]
enabled = true
listen_port = 2222
listen_endpoints = tcp:2222:interface=0.0.0.0
public_key = ssh_host_rsa_key.pub
private_key = ssh_host_rsa_key

[telnetsrv]
enabled = true
listen_port = 8888

[output_jsonlog]
enabled = true
log_file = /var/log/cowrie/cowrie.json.log

[sensor]
download_path = /home/cowrie/downloads

